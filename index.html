<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Overtime Management</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    background:#f5f5f5;
}

header{
    background:#1f4e79;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.tabs{
    display:flex;
    margin-bottom:20px;
}

.tab-button{
    flex:1;
    padding:15px;
    border:none;
    cursor:pointer;
    background:#d9d9d9;
    font-size:16px;
    font-weight:bold;
}

.tab-button.active{
    background:#1f4e79;
    color:white;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

input, select, button{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    background:#1f4e79;
    color:white;
    cursor:pointer;
    border:none;
}

button:hover{
    background:#163b5c;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th, table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:left;
}

table th{
    background:#1f4e79;
    color:white;
}

.success{
    color:green;
    font-weight:bold;
}

.hidden{
    display:none;
}

.duration-container{
    display:flex;
    gap:10px;
}

</style>

</head>

<body>

<header>
    Employee Overtime Management
</header>

<div class="container">

    <div class="card">

        <!-- TABS -->
        <div class="tabs">

            <button class="tab-button active"
                onclick="openTab('entryTab', this)">
                Overtime Entry
            </button>

            <button class="tab-button"
                onclick="openTab('displayTab', this)">
                Overtime Display
            </button>

        </div>

        <!-- ENTRY TAB -->
        <div id="entryTab" class="tab-content active">

            <h2>Overtime Entry</h2>

            <input type="text"
                id="empName"
                placeholder="Employee Name">

            <input type="text"
                id="empCode"
                placeholder="Employee Code">

            <input type="date"
                id="otDate">

            <div class="duration-container">

                <select id="hours">
                    <option value="">Hours</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>

                <select id="minutes">
                    <option value="">Minutes</option>
                    <option value="00">00</option>
                    <option value="15">15</option>
                    <option value="30">30</option>
                    <option value="45">45</option>
                </select>

            </div>

            <button onclick="addOvertime()">
                Add Overtime
            </button>

            <div id="entryMessage" class="success"></div>

            <table id="entryTable">

                <thead>
                    <tr>
                        <th>Employee Name</th>
                        <th>Employee Code</th>
                        <th>Date</th>
                        <th>Duration</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

        <!-- DISPLAY TAB -->
        <div id="displayTab" class="tab-content">

            <h2>Overtime Display</h2>

            <input type="password"
                id="password"
                placeholder="Enter Password">

            <button onclick="checkPassword()">
                Login
            </button>

            <div id="displaySection" class="hidden">

                <input type="date"
                    id="fromDate">

                <input type="date"
                    id="toDate">

                <button onclick="loadData()">
                    Display
                </button>

                <table id="displayTable">

                    <thead>
                        <tr>
                            <th>Employee Name</th>
                            <th>Employee Code</th>
                            <th>Date</th>
                            <th>Duration</th>
                        </tr>
                    </thead>

                    <tbody></tbody>

                </table>

                <button onclick="exportTableToExcel()">
                    Export to Excel
                </button>

            </div>

        </div>

    </div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvl5wKagxVhGOfORGMzMhorTjsBgb4FMVXDvNlonkKoa0XRG5b_eJH76v_HIUaqz2bGA/exec";

const DISPLAY_PASSWORD = "admin123";

function openTab(tabId, element){

    let tabs = document.getElementsByClassName("tab-content");

    for(let i=0; i<tabs.length; i++){
        tabs[i].classList.remove("active");
    }

    let buttons = document.getElementsByClassName("tab-button");

    for(let i=0; i<buttons.length; i++){
        buttons[i].classList.remove("active");
    }

    document.getElementById(tabId)
        .classList.add("active");

    element.classList.add("active");
}

function addOvertime(){

    let name = document.getElementById("empName").value;
    let code = document.getElementById("empCode").value;
    let date = document.getElementById("otDate").value;

    let hours = document.getElementById("hours").value;
    let minutes = document.getElementById("minutes").value;

    let duration = hours + " Hr " + minutes + " Min";

    if(name==="" || code==="" || date==="" ||
        hours==="" || minutes===""){

        alert("Please fill all fields");
        return;
    }

    fetch(SCRIPT_URL,{

        method:"POST",

        body:JSON.stringify({
            action:"add",
            name:name,
            code:code,
            date:date,
            duration:duration
        })

    })

    .then(res=>res.json())

    .then(data=>{

        document.getElementById("entryMessage").innerHTML =
            "Overtime Added Successfully";

        let tbody = document.querySelector("#entryTable tbody");

        let row = `
            <tr>
                <td>${name}</td>
                <td>${code}</td>
                <td>${date}</td>
                <td>${duration}</td>
            </tr>
        `;

        tbody.innerHTML += row;

        document.getElementById("empName").value="";
        document.getElementById("empCode").value="";
        document.getElementById("otDate").value="";
        document.getElementById("hours").value="";
        document.getElementById("minutes").value="";
    });

}

function checkPassword(){

    let pass = document.getElementById("password").value;

    if(pass === DISPLAY_PASSWORD){

        document.getElementById("displaySection")
            .classList.remove("hidden");

    }else{

        alert("Wrong Password");
    }
}

function loadData(){

    let fromDate = document.getElementById("fromDate").value;
    let toDate = document.getElementById("toDate").value;

    fetch(`${SCRIPT_URL}?action=get&from=${fromDate}&to=${toDate}`)

    .then(res=>res.json())

    .then(data=>{

        data.sort((a,b)=>
            a.name.localeCompare(b.name)
        );

        let tbody = document.querySelector("#displayTable tbody");

        tbody.innerHTML = "";

        data.forEach(item=>{

            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.code}</td>
                    <td>${item.date}</td>
                    <td>${item.duration}</td>
                </tr>
            `;
        });

    });

}

function exportTableToExcel(){

    let table = document.getElementById("displayTable");

    let html = table.outerHTML;

    let url = 'data:application/vnd.ms-excel,' + escape(html);

    let link = document.createElement("a");

    link.href = url;

    link.download = "Overtime_Report.xls";

    link.click();
}

</script>

</body>
</html>
