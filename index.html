<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Overtime Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .duration-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-family: 'Poppins', sans-serif;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .password-section {
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        .export-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .duration-group {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .tabs {
                flex-direction: column;
                gap: 10px;
            }
            
            .tab {
                width: 100%;
                text-align: center;
            }
            
            th, td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ Employee Overtime Management System</h1>
            <p>Track and manage employee overtime efficiently</p>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('entry')">📝 Overtime Entry</button>
                <button class="tab" onclick="switchTab('display')">📊 View Reports</button>
            </div>

            <!-- Overtime Entry Tab -->
            <div id="entryTab" class="tab-content active">
                <h2>Enter Overtime Details</h2>
                <form id="overtimeForm">
                    <div class="form-group">
                        <label>Employee Name *</label>
                        <input type="text" id="empName" placeholder="Enter employee name" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Employee Code *</label>
                        <input type="text" id="empCode" placeholder="Enter employee code" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Overtime Date *</label>
                        <input type="date" id="otDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Overtime Duration *</label>
                        <div class="duration-group">
                            <select id="hours" required>
                                <option value="">Hours</option>
                                <option value="0">0 Hour</option>
                                <option value="1">1 Hour</option>
                                <option value="2">2 Hours</option>
                                <option value="3">3 Hours</option>
                                <option value="4">4 Hours</option>
                                <option value="5">5 Hours</option>
                                <option value="6">6 Hours</option>
                                <option value="7">7 Hours</option>
                                <option value="8">8 Hours</option>
                                <option value="9">9 Hours</option>
                                <option value="10">10 Hours</option>
                                <option value="11">11 Hours</option>
                                <option value="12">12 Hours</option>
                            </select>
                            
                            <select id="minutes" required>
                                <option value="">Minutes</option>
                                <option value="00">00 Min</option>
                                <option value="15">15 Min</option>
                                <option value="30">30 Min</option>
                                <option value="45">45 Min</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="button" onclick="addOvertime()">➕ Add Overtime Record</button>
                </form>
                <div id="entryMessage" class="message"></div>
                
                <h3 style="margin-top: 30px;">Recent Entries Preview</h3>
                <div style="overflow-x: auto;">
                    <table id="previewTable">
                        <thead>
                            <tr>
                                <th>Employee Name</th>
                                <th>Employee Code</th>
                                <th>Date</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody id="previewBody">
                            <tr><td colspan="4" style="text-align: center;">No records added yet</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Reports Tab -->
            <div id="displayTab" class="tab-content">
                <h2>View Overtime Reports</h2>
                <div class="password-section">
                    <label>Authentication Required</label>
                    <input type="password" id="password" placeholder="Enter admin password">
                    <button onclick="authenticate()" style="margin-top: 10px;">🔐 Unlock Reports</button>
                </div>
                
                <div id="reportSection" class="hidden">
                    <div class="form-group">
                        <label>Date Range</label>
                        <div class="duration-group">
                            <input type="date" id="fromDate" placeholder="From Date">
                            <input type="date" id="toDate" placeholder="To Date">
                        </div>
                    </div>
                    <button onclick="loadReports()">📅 Load Reports</button>
                    
                    <div style="overflow-x: auto;">
                        <table id="reportTable">
                            <thead>
                                <tr>
                                    <th>Employee Name</th>
                                    <th>Employee Code</th>
                                    <th>Date</th>
                                    <th>Duration</th>
                                </tr>
                            </thead>
                            <tbody id="reportBody">
                                <tr><td colspan="4" style="text-align: center;">Please authenticate to view reports</td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <button class="export-btn" onclick="exportToExcel()">📎 Export to Excel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANT: Replace this URL with your Google Apps Script Web App URL
        const SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE"; // <-- PASTE YOUR URL HERE
        
        const ADMIN_PASSWORD = "admin123";
        let recentEntries = [];
        
        // Set today's date as default
        document.getElementById('otDate').valueAsDate = new Date();
        
        function switchTab(tabName) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            if (tabName === 'entry') {
                document.getElementById('entryTab').classList.add('active');
            } else {
                document.getElementById('displayTab').classList.add('active');
            }
        }
        
        async function addOvertime() {
            const name = document.getElementById('empName').value.trim();
            const code = document.getElementById('empCode').value.trim();
            const date = document.getElementById('otDate').value;
            const hours = document.getElementById('hours').value;
            const minutes = document.getElementById('minutes').value;
            
            if (!name || !code || !date || !hours || !minutes) {
                showMessage('entryMessage', 'Please fill all required fields', 'error');
                return;
            }
            
            const duration = `${hours} Hr ${minutes} Min`;
            
            // Show loading state
            const submitBtn = event.target;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        code: code,
                        date: date,
                        duration: duration
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showMessage('entryMessage', '✅ Overtime added successfully!', 'success');
                    
                    // Add to preview table
                    addToPreview(name, code, date, duration);
                    
                    // Clear form
                    document.getElementById('empName').value = '';
                    document.getElementById('empCode').value = '';
                    document.getElementById('hours').value = '';
                    document.getElementById('minutes').value = '';
                    document.getElementById('otDate').valueAsDate = new Date();
                } else {
                    showMessage('entryMessage', 'Error: ' + (result.message || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                let errorMsg = 'Network error: Cannot reach server. ';
                if (SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
                    errorMsg += 'Please configure the SCRIPT_URL with your Google Apps Script URL.';
                } else {
                    errorMsg += 'Check your Apps Script deployment and ensure it\'s published as a Web App with "Anyone" access.';
                }
                showMessage('entryMessage', errorMsg, 'error');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }
        
        function addToPreview(name, code, date, duration) {
            const previewBody = document.getElementById('previewBody');
            
            // Clear "no records" message if present
            if (previewBody.children.length === 1 && previewBody.children[0].innerHTML.includes('No records')) {
                previewBody.innerHTML = '';
            }
            
            const row = previewBody.insertRow(0);
            row.insertCell(0).textContent = name;
            row.insertCell(1).textContent = code;
            row.insertCell(2).textContent = date;
            row.insertCell(3).textContent = duration;
            
            // Keep only last 10 entries in preview
            while (previewBody.children.length > 10) {
                previewBody.removeChild(previewBody.lastChild);
            }
        }
        
        function authenticate() {
            const password = document.getElementById('password').value;
            const reportSection = document.getElementById('reportSection');
            
            if (password === ADMIN_PASSWORD) {
                reportSection.classList.remove('hidden');
                showMessage('entryMessage', 'Authentication successful!', 'success');
                document.getElementById('reportBody').innerHTML = '<tr><td colspan="4" style="text-align: center;">Select date range and click "Load Reports"</td></tr>';
            } else {
                alert('Invalid password! Access denied.');
                reportSection.classList.add('hidden');
            }
        }
        
        async function loadReports() {
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            
            if (!fromDate || !toDate) {
                alert('Please select both From and To dates');
                return;
            }
            
            const reportBody = document.getElementById('reportBody');
            reportBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Loading...</td></tr>';
            
            try {
                const url = `${SCRIPT_URL}?from=${fromDate}&to=${toDate}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status === 'error') {
                    reportBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Error: ${data.message}</td></tr>`;
                    return;
                }
                
                if (!Array.isArray(data) || data.length === 0) {
                    reportBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No records found for selected date range</td></tr>';
                    return;
                }
                
                // Display records
                reportBody.innerHTML = '';
                data.forEach(record => {
                    const row = reportBody.insertRow();
                    row.insertCell(0).textContent = record.name || '-';
                    row.insertCell(1).textContent = record.code || '-';
                    row.insertCell(2).textContent = record.date || '-';
                    row.insertCell(3).textContent = record.duration || '-';
                });
                
                // Store for export
                window.currentReportData = data;
                
            } catch (error) {
                console.error('Error loading reports:', error);
                reportBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: red;">Network error loading reports. Check Apps Script URL and deployment.</td></tr>';
            }
        }
        
        function exportToExcel() {
            if (!window.currentReportData || window.currentReportData.length === 0) {
                alert('No data to export. Please load reports first.');
                return;
            }
            
            let csv = "Employee Name,Employee Code,Date,Duration\n";
            window.currentReportData.forEach(record => {
                csv += `"${record.name}","${record.code}","${record.date}","${record.duration}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', `overtime_report_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        function showMessage(elementId, message, type) {
            const msgDiv = document.getElementById(elementId);
            msgDiv.textContent = message;
            msgDiv.className = `message ${type}`;
            setTimeout(() => {
                msgDiv.style.display = 'none';
                setTimeout(() => {
                    msgDiv.className = 'message';
                    msgDiv.style.display = '';
                }, 100);
            }, 3000);
        }
        
        // Check if URL is configured
        if (SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbwiBxyuhZTU0aB4DS7885vyvo7axTfzVkcUMPM-Qs7ynvZ-vo85tJlPFu9DCILcVmRaCA/exec) {
            console.warn('⚠️ Please configure the SCRIPT_URL with your Google Apps Script Web App URL');
            const warning = document.createElement('div');
            warning.style.cssText = 'background: #fff3cd; color: #856404; padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center;';
            warning.innerHTML = '⚠️ <strong>Setup Required:</strong> Please replace "YOUR_APPS_SCRIPT_URL_HERE" with your Google Apps Script Web App URL. See instructions in the HTML comments.';
            document.querySelector('.card').insertBefore(warning, document.querySelector('.card').firstChild);
        }
    </script>
</body>
</html>
